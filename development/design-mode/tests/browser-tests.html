<!doctype html><html lang="en"><meta charset="utf-8"><title>Design Mode checks</title>
<style>body{font:14px system-ui;background:#111;color:#eee}iframe{border:1px solid #555;display:block}pre{white-space:pre-wrap}</style>
<h1>Isolated Design Mode checks</h1><pre id="result">Running…</pre><iframe id="preview" title="Design Mode preview" src="../index.html" width="390" height="844"></iframe>
<script src="checks.js"></script><script src="phone-checks.js"></script><script src="navigation-checks.js"></script><script src="mixer-strip-checks.js"></script><script src="viewport-checks.js"></script><script src="cleanup-checks.js"></script><script>
const frame = document.getElementById('preview');
frame.onload = async () => {
  const results = []; let count = 0;
  function check(value, message) { if (!value) throw Error(message); count++; }
  try {
    const win = frame.contentWindow, doc = win.document;
    count += runStateChecks(win.TuneToxDesign.model, win.TuneToxDesign.samplerModel);
    check(win.TuneToxDesign.preview.getSnapshot().layout === 'full' && win.TuneToxDesign.preview.getSnapshot().arrangement === 'slices', 'new default');

    doc.querySelector('#preview-arrangement').value = 'quadrants'; doc.querySelector('#preview-arrangement').dispatchEvent(new win.Event('change'));
    check(doc.querySelectorAll('.design-deck').length === 4, 'four mounted deck cards');
    check(doc.querySelectorAll('.library-panel').length === 2, 'exactly two panels');
    check(!doc.querySelector('audio,video'), 'no media elements');
    check(!win.appState && !win.completeSongEngine, 'no production globals');

    check(doc.querySelectorAll('.deck-tuning input').length === 8, 'per-deck tempo and pitch');

    check(win.TuneToxDesign.preview.getSnapshot().decks[2].songId === 'neon', 'UI loads deck 3');

        check(rect('.library').right <= rect('.mixer').left, 'sidebar left of decks ' + width);
        check(Math.abs(rect('.library').width / (rect('.library').width + rect('.mixer').width) - .27) < .01, '27% sidebar ' + width);
        check(rect('#song-panel').top >= rect('#playlist-panel').bottom, 'stacked library panels ' + width);
        check(Math.abs(rect('.library').top - rect('.mixer').top) < 1 && Math.abs(rect('.library').bottom - rect('.mixer').bottom) < 1, 'full-height columns ' + width);

        check(rect('.deck-grid').bottom >= rect('.mixer').bottom - 1, 'decks fill height ' + width);

          const list = doc.querySelector(selector);
          check(win.getComputedStyle(list).overflowY === 'auto' && list.clientHeight > 40, 'independent usable scroller ' + selector + width);

        check([...doc.querySelectorAll('.design-deck')].filter(n => win.getComputedStyle(n).display !== 'none').length === 1, 'one visible phone deck ' + width);

        check(doc.documentElement.scrollHeight <= height, 'phone no whole page scroll');

        check(rect('.library').top >= rect('.mixer').bottom - 1, 'library below mixer ' + width);

        const cards = [...doc.querySelectorAll('.design-deck')].map(node => node.getBoundingClientRect());

    const sideSelect = doc.querySelector('#preview-drawer-side');
    const drawerToggle = doc.querySelector('#preview-drawer-toggle');
    doc.querySelector('.library .song-manage').click();
    doc.querySelector('.library .management-choice input').click();

            let escapedPointers = 0;
            const observePointer = () => { escapedPointers++; };

            overlay.dispatchEvent(new win.PointerEvent('pointerdown', { bubbles: true }));

    doc.querySelector('.library .song-manage').click(); doc.querySelector('.library .management-choice input').click(); doc.querySelector('.library .context-back').click();
    frame.width = 768; frame.height = 1024;
    await new Promise(resolve => setTimeout(resolve, 80)); win.TuneToxDesign.viewport.refresh();
    layoutSelect.value = 'full'; layoutSelect.dispatchEvent(new win.Event('change'));
    arrangementSelect.value = 'slices'; arrangementSelect.dispatchEvent(new win.Event('change'));
    const portraitCards = [...doc.querySelectorAll('.design-deck')].map(n => n.getBoundingClientRect());
    check(portraitCards[2].top > portraitCards[0].top && win.getComputedStyle(doc.querySelector('.deck-load')).display !== 'none' && win.getComputedStyle(doc.querySelector('.slice-header-tuning')).display === 'none', 'slice setting does not alter portrait grid or controls');
    arrangementSelect.value = 'quadrants'; arrangementSelect.dispatchEvent(new win.Event('change'));
    check(win.getComputedStyle(doc.querySelector('.layout-preview-controls')).display === 'none' && win.getComputedStyle(doc.querySelector('.library')).display !== 'none', 'landscape options do not alter portrait');
    layoutSelect.value = 'sidebar'; layoutSelect.dispatchEvent(new win.Event('change'));
    const savedList = doc.querySelector('#song-list'); savedList.scrollTop = 100;
    const savedTop = savedList.scrollTop;
    doc.querySelector('.deck-links').click(); doc.querySelector('.library .context-back').click();
    check(savedList.scrollTop === savedTop, 'context restores song scroll');
    const librarySearch = doc.querySelector('#song-search');
    librarySearch.value = 'Neon'; librarySearch.dispatchEvent(new win.Event('input', { bubbles: true }));
    const savedSelection = win.TuneToxDesign.preview.getSnapshot().songId;
    doc.querySelector('.deck-links').click();
    check(doc.querySelector('.library .context-source').textContent.includes('Neon Departure'), 'links source identified');
    check(doc.querySelector('.library .library-context').textContent.includes('No user-created links yet'), 'no links empty state');
    doc.querySelector('.library .context-back').click();
    check(librarySearch.value === 'Neon' && win.TuneToxDesign.preview.getSnapshot().songId === savedSelection, 'return preserves library query/selection');
    doc.querySelector('.library .song-manage').click();
    const choice = doc.querySelector('.library .management-choice input'); choice.click();
    check(win.TuneToxDesign.preview.getSnapshot().userLinks.neon.includes('after'), 'manage creates manual link');
    const memberChoices = [...doc.querySelectorAll('.library .manage-playlist-row input')];
    memberChoices[memberChoices.length - 2].click();
    check(win.TuneToxDesign.preview.getSnapshot().playlists.find(p => p.id === 'slow').songIds.includes('neon') === false, 'manage removes playlist membership');

    doc.querySelector('.deck-links').click();
    check(doc.querySelector('.library .context-body').textContent.includes('After the Rain'), 'deck links reflects manual links');
    doc.querySelector('.library .context-back').click();
    doc.querySelectorAll('.deck-links')[3].click();
    check(doc.querySelector('.library .context-source').textContent.includes('No song loaded'), 'empty deck links state');
    doc.querySelector('.library .context-back').click();
    doc.querySelector('#reset-demo').click();
    check(win.TuneToxDesign.preview.getSnapshot().decks[2].songId === null, 'UI reset');
    frame.width = 1194; frame.height = 834;
    await new Promise(resolve => setTimeout(resolve, 80)); win.TuneToxDesign.viewport.refresh();
    const modularCards = [...doc.querySelectorAll('.design-deck')];
    function columnMode(index, value) {
      modularCards[index].querySelector('[data-mode="' + value + '"]').click();

      await new Promise(resolve => setTimeout(resolve, 80)); win.TuneToxDesign.viewport.refresh();
      check(modularCards.every(n => n.scrollHeight <= n.clientHeight + 1 && n.scrollWidth <= n.clientWidth + 1), 'four libraries fit each column ' + width);
      check(libraries.every(n => [...n.querySelectorAll('.panel-list')].filter(list => list.clientHeight > 0).length === 1 && [...n.querySelectorAll('.panel-list')].some(list => list.clientHeight > 40)), 'one usable library scroller per column ' + width);

    doc.querySelector('#reset-demo').click();
    frame.width = 1194; frame.height = 834;
    await new Promise(resolve => setTimeout(resolve, 100)); win.TuneToxDesign.viewport.refresh();
    columnMode(0, 'library'); columnMode(1, 'controls'); columnMode(2, 'library');
    libraries[0].querySelector('.column-links-tab').click();
    check(libraries[0].textContent.includes('Links from Neon Departure') && libraries[0].textContent.includes('No user-created links'), 'Links initially follows loaded deck song');
    libraries[2].querySelector('.column-links-tab').click();
    check(libraries[2].textContent.includes('No song loaded'), 'empty deck Links state');
    libraries[0].querySelector('.column-songs-tab').click(); libraries[0].querySelector('.song-manage').click();
    libraries[0].querySelector('.management-choice input').click(); libraries[0].querySelector('.context-back').click();
    libraries[0].querySelector('.column-links-tab').click();
    check(libraries[0].querySelector('.song-row').textContent.includes('After the Rain'), 'Library Links reflects managed links');
    libraries[0].querySelector('.song-select').click(); libraries[0].querySelector('.column-load-button:last-child').click();
    const deckTwoStems = win.TuneToxDesign.preview.getSnapshot().decks[1].stems.slice();
    const mainVolume = doc.querySelector('#overlay-main-2'); mainVolume.value = '.25'; mainVolume.dispatchEvent(new win.Event('input'));
    check(win.TuneToxDesign.preview.getSnapshot().decks[1].volume === .25 && JSON.stringify(win.TuneToxDesign.preview.getSnapshot().decks[1].stems) === JSON.stringify(deckTwoStems), 'main volume independent of stems');
    const beforeSampler = win.TuneToxDesign.preview.getSnapshot();
    const sourceButton = modularCards[3].querySelectorAll('.stem-sampler-trigger')[3];
    sourceButton.click();
    check(win.TuneToxDesign.preview.getSnapshot().sampler.deckId === 4 && win.TuneToxDesign.preview.getSnapshot().sampler.stemIndex === 3, 'stem label selects shared sampler source');
    check(doc.querySelectorAll('.sampler-pad').length === 25 && doc.querySelector('.shared-sampler').hidden === false, 'one shared 25 pad sampler');
    check(modularCards.every(n => n.querySelectorAll('.column-mode-button').length === 3), 'exactly three top level tabs retained');
    const sourceDeck = doc.querySelector('#sampler-source-deck'), sourceStem = doc.querySelector('#sampler-source-stem');
    const attenuationInput = doc.querySelector('#sampler-attenuation'), outputInput = doc.querySelector('#sampler-output');
    attenuationInput.value = '.3'; attenuationInput.dispatchEvent(new win.Event('input'));
    sourceDeck.value = '2'; sourceDeck.dispatchEvent(new win.Event('change'));
    check(win.TuneToxDesign.preview.getSnapshot().sampler.attenuation[3] === .3, 'same parent session across source decks');
    sourceStem.value = '1'; sourceStem.dispatchEvent(new win.Event('change'));
    check(win.TuneToxDesign.preview.getSnapshot().sampler.attenuation[3] === 1, 'source change restores previous parent attenuation');
    attenuationInput.value = '.4'; attenuationInput.dispatchEvent(new win.Event('input'));
    outputInput.value = '.2'; outputInput.dispatchEvent(new win.Event('input'));
    doc.querySelectorAll('.sampler-pad')[24].click();
    check(win.TuneToxDesign.preview.getSnapshot().sampler.lastPad === 24, 'simulated pad trigger');
    check(JSON.stringify(win.TuneToxDesign.preview.getSnapshot().decks) === JSON.stringify(beforeSampler.decks), 'sampler does not change deck allocations/levels/state');
    for (const [width,height] of [[1024,768],[1194,834],[1366,1024],[900,680]]) {
      frame.width = width; frame.height = height; await new Promise(resolve => setTimeout(resolve, 100)); win.TuneToxDesign.viewport.refresh();
      const previewRects = [...doc.querySelectorAll('.sampler-deck-preview')].map(n => n.getBoundingClientRect());
      check(previewRects.every((r,i) => r.top === previewRects[0].top && (!i || r.left > previewRects[i-1].left)), 'four side-by-side horizontal deck previews ' + width);
      check([...doc.querySelectorAll('.sampler-mini-wave')].every(n => {
        const box = n.getBoundingClientRect(), wave = n.querySelector('svg').getBoundingClientRect();
        return wave.width > wave.height && wave.left >= box.left - 1 && wave.right <= box.right + 1 && wave.top >= box.top - 1 && wave.bottom <= box.bottom + 1;
      }), 'horizontal waveforms contained in their previews ' + width);
      check([...doc.querySelectorAll('.sampler-pad')].every(n => n.clientHeight >= 44 && n.clientWidth >= 44), 'touch size sampler pads ' + width);
      check(doc.documentElement.scrollWidth <= width && doc.documentElement.scrollHeight <= height, 'sampler no page overflow ' + width);

      check(doc.querySelector('.sampler-pads').getBoundingClientRect().bottom <= panelRect.bottom + 1, 'pads fit sampler ' + width);
    }
    frame.width = 768; frame.height = 1024; await new Promise(resolve => setTimeout(resolve, 100)); win.TuneToxDesign.viewport.refresh();

    frame.width = 1194; frame.height = 834; await new Promise(resolve => setTimeout(resolve, 100)); win.TuneToxDesign.viewport.refresh();
    // Force a render after viewport change, as the sampler source remains session-only.
    sourceDeck.dispatchEvent(new win.Event('change'));
    doc.querySelector('.sampler-close').click();
    const afterSampler = win.TuneToxDesign.preview.getSnapshot();
    check(JSON.stringify(afterSampler.decks) === JSON.stringify(beforeSampler.decks) && JSON.stringify(afterSampler.columnLibraries) === JSON.stringify(beforeSampler.columnLibraries), 'sampler return restores exact column presentation/navigation');
    check(afterSampler.sampler.attenuation[1] === 1 && afterSampler.sampler.outputVolume === .2, 'close restores parent attenuation without changing output volume');
    doc.querySelector('#reset-demo').click();
    await runPhoneChecks(frame, check);
    await runNavigationChecks(frame, check);
    await runMixerStripChecks(frame, check);
    await runViewportChecks(frame, check);
    await runCleanupChecks(frame, check);
    const review = new URLSearchParams(location.search).get('review');
    if (['sidebar', 'full', 'left', 'right', 'manage', 'slices', 'slices-full', 'slices-left', 'slices-right', 'slices-controls', 'slices-controls-full', 'columns', 'sampler', 'phone-decks', 'phone-controls', 'phone-transition', 'phone-sampler', 'phone-manage'].includes(review)) {
      frame.width = 1194; frame.height = 834;
      layoutSelect.value = ['sidebar', 'manage', 'slices', 'slices-controls'].includes(review) ? 'sidebar' : 'full'; layoutSelect.dispatchEvent(new win.Event('change'));
      arrangementSelect.value = (review.startsWith('slices') || ['columns', 'sampler', 'phone-decks', 'phone-controls', 'phone-transition', 'phone-sampler', 'phone-manage'].includes(review)) ? 'slices' : 'quadrants'; arrangementSelect.dispatchEvent(new win.Event('change'));
      if (review.includes('controls')) {
        if (review.endsWith('full')) columnMode(0, 'controls'); else doc.querySelector('.slice-view-switch').click();
      }
      if (review.startsWith('phone')) {
        const requestedWidth = Number(new URLSearchParams(location.search).get('phoneWidth'));
        const requestedHeight = Number(new URLSearchParams(location.search).get('phoneHeight'));
        frame.width = [320,375,390,393,430].includes(requestedWidth) ? requestedWidth : 390;
        frame.height = [568,667,844,852,932].includes(requestedHeight) ? requestedHeight : 844;
        await new Promise(resolve => setTimeout(resolve, 100)); win.TuneToxDesign.viewport.refresh();
        if (review === 'phone-manage') { doc.querySelector('.phone-tab[data-tab="library"]').click(); doc.querySelector('.design-deck[data-phone-visible="true"] .song-manage').click(); }
        if (review === 'phone-controls') columnMode(0, 'controls');
        if (review === 'phone-transition') { doc.querySelector('.phone-tab[data-tab="controls"]').click(); doc.querySelector('.transition-controls-option').click(); }
        if (review === 'phone-sampler') doc.querySelector('.phone-tab[data-tab="sampler"]').click();
      }
      if (review === 'sampler') modularCards[0].querySelector('.stem-sampler-trigger').click();
      if (review === 'columns') { columnMode(0, 'library'); columnMode(1, 'controls'); columnMode(3, 'library'); }
      if (review === 'manage') doc.querySelector('.library .song-manage').click();
      if (review.endsWith('left') || review.endsWith('right')) {
        sideSelect.value = review.endsWith('left') ? 'left' : 'right'; sideSelect.dispatchEvent(new win.Event('change')); drawerToggle.click();
      }
    }
    document.getElementById('result').textContent = 'PASS: ' + count + ' checks\n' + results.join('\n');
  } catch (error) { document.getElementById('result').textContent = 'FAIL: ' + error.message; }
};
