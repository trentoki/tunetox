<body>
  <div class="design-app">
    <header class="design-header">
      <h1><span class="brand-mark" aria-hidden="true">▥</span> TUNETOX — DESIGN MODE</h1>
      <span class="mode-badge">NO AUDIO</span>
    </header>
    <section class="mixer" aria-label="Simulated four-deck mixer">
      <div class="global-strip" aria-label="Simulated global controls">
        <label class="global-control">TEMPO <output id="tempo-value" for="demo-tempo">120.0</output>
          <input id="demo-tempo" type="range" min="90" max="150" step="0.5" value="120" aria-label="Simulated global tempo">
        </label>
        <label class="global-control">PITCH <output id="pitch-value" for="demo-pitch">+0.0</output>
          <input id="demo-pitch" type="range" min="-6" max="6" step="0.1" value="0" aria-label="Simulated global pitch in semitones">
        </label>
        <button id="reset-demo" class="quiet-button" type="button">Reset demo</button>
      </div>
      <div id="design-decks" class="deck-grid"></div>
    </section>
    <main class="library" aria-label="Example library">
      <section id="playlist-panel" class="library-panel" aria-labelledby="playlist-heading">
        <header class="panel-heading"><h2 id="playlist-heading">Playlists</h2><span class="example-label">EXAMPLE</span></header>
        <label class="search-label"><span class="visually-hidden">Search example playlists</span><input id="playlist-search" type="search" placeholder="Search" autocomplete="off"></label>
        <div id="playlist-list" class="panel-list" tabindex="0" aria-label="Example playlists"></div>
        <div class="panel-footnote">Fictional library</div>
      </section>
      <section id="song-panel" class="library-panel" aria-labelledby="song-heading">
        <header class="panel-heading"><h2 id="song-heading">Songs</h2><span id="song-count" class="example-label"></span></header>
        <label class="search-label"><span class="visually-hidden">Search example songs and artists</span><input id="song-search" type="search" placeholder="Search songs or artists" autocomplete="off"></label>
        <div id="song-list" class="panel-list" tabindex="0" aria-label="Example songs"></div>
        <div class="load-bar">
          <div class="selected-track"><span class="eyebrow">SELECTED EXAMPLE</span><strong id="selected-title">Select a song</strong></div>
          <div id="library-load-targets" class="load-targets" aria-label="Load selected example into a simulated deck"></div>
        </div>
      </section>
    </main>
    <footer class="design-footer"><span id="design-status" role="status" aria-live="polite">Select an example song, then load it into a deck.</span><span id="design-build" title="Design Mode build DM-20261114-M1">DEV M1-1114</span><span>SIMULATION ONLY</span></footer>
  </div>
  <noscript>This simulated Design Mode requires JavaScript. It does not play audio.</noscript>
</body>
</html>
