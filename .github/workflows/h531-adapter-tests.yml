name: H5.3.1 adapter tests

on:
  push:
    branches:
      - integration/h531-audio-adapter
  workflow_dispatch:

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test H5.3.1 adapters without audio hardware
        run: node --test development/integration/h531-*.test.js
