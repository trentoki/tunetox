<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=contain">
  <meta name="color-scheme" content="dark">
  <title>TuneTox D2</title>
  <link rel="stylesheet" href="app/visual/mixer/playback.css">
  <link rel="stylesheet" href="app/visual/iphone/layout.css">
  <link rel="stylesheet" href="app/visual/library/library.css">
  <script type="module" src="app/visual/mixer/application.js"></script>
</head>
<body>
  <div class="app">
    <header class="mixer-header">
      <h1>TuneTox D2</h1>
    </header>
    <main class="mixer-decks" aria-label="Four-deck mixer"></main>
    <footer class="mixer-footer">
      <span role="status" id="playback-status">Load a file, press Play, then raise Main. Pitch, EQ and effects remain previews.</span>
      <span>D2</span>
    </footer>
  </div>
  <noscript>JavaScript is required for playback.</noscript>
</body>
</html>
